[package]
name = "polars-random"
version = "0.6.0"
description = "Polars plugin for generating random distributions"
edition = "2021"
rust-version = "1.95"
license = "MIT"
readme = "README.md"

[lib]
name = "_polars_random"
crate-type = ["cdylib"]

[dependencies]
polars = { version = "0.55.2", default-features = false }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
pyo3-polars = { version = "0.28.0", features = ["derive"] }
rand = { version = "0.10" }
rand_distr = "0.6"
serde = { version = "1", features = ["derive"] }
